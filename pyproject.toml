[project]
name = "dsa-for-data-science"
version = "0.1.0"
description = "DSA interview preparation organised by pattern, with every solution verified against a brute-force oracle."
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --strict-markers"
testpaths = ["DSA", "sql", "pandas_practice", "scripts"]
python_files = ["lc*.py", "x_*.py", "test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
